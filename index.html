<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名掲示板 (2ch風)</title>
  <!-- Supabaseのライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #efefef;
      color: #000;
      font-family: "MS Pゴシック", "MS PGothic", sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #800000; font-size: 24px; border-bottom: 2px solid #800000; }
    .post-form {
      background: #e0e0e0;
      padding: 15px;
      border: 1px solid #999;
      margin-bottom: 20px;
    }
    input[type="text"], textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 5px;
      box-sizing: border-box;
    }
    button {
      background: #ccc;
      border: 1px solid #666;
      padding: 5px 15px;
      cursor: pointer;
    }
    .post {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #ccc;
    }
    .post-header {
      color: #008000;
      font-weight: bold;
    }
    .post-header span { color: #000; font-weight: normal; }
    .post-content { margin-top: 5px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h1>🚀 2ch風 匿名掲示板</h1>

  <!-- 投稿フォーム -->
  <div class="post-form">
    <label>名前:</label>
    <input type="text" id="name" placeholder="名無しさん" value="名無しさん">
    <label>本文:</label>
    <textarea id="content" rows="4" placeholder="書き込み内容を入力..."></textarea>
    <button onclick="addPost()">書き込む</button>
  </div>

  <!-- レス一覧表示エリア -->
  <div id="posts">読み込み中...</div>

  <script>
    // Supabaseの設定
    const SUPABASE_URL = 'https://yeotqaorheaxjppylfgg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sUx3gtUhP6hHPhnxrACBnQ_5FsbVTOW';

    // 変数名を dbClient に変更して名前の衝突を完全に防止！
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 投稿一覧を取得して表示する関数
    async function fetchPosts() {
      const { data, error } = await dbClient
        .from('posts')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        console.error('エラー:', error);
        document.getElementById('posts').innerText = 'エラーが発生しました: ' + error.message;
        return;
      }

      const postsDiv = document.getElementById('posts');

      if (!data || data.length === 0) {
        postsDiv.innerHTML = 'まだ書き込みがありません。最初のレスを投稿してみよう！';
        return;
      }

      postsDiv.innerHTML = '';

      data.forEach(post => {
        const date = new Date(post.created_at).toLocaleString('ja-JP');
        const postElement = document.createElement('div');
        postElement.className = 'post';
        postElement.innerHTML = `
          <div class="post-header">
            ${post.id} ：<b>${escapeHTML(post.name)}</b>：<span>${date}</span>
          </div>
          <div class="post-content">${escapeHTML(post.content)}</div>
        `;
        postsDiv.appendChild(postElement);
      });
    }

    // 投稿を追加する関数
    async function addPost() {
      const nameInput = document.getElementById('name').value.trim() || '名無しさん';
      const contentInput = document.getElementById('content').value.trim();

      if (!contentInput) {
        alert('本文を入力してください');
        return;
      }

      const { error } = await dbClient
        .from('posts')
        .insert([{ name: nameInput, content: contentInput }]);

      if (error) {
        alert('投稿に失敗しました: ' + error.message);
      } else {
        document.getElementById('content').value = '';
        fetchPosts(); // 一覧を再読み込み
      }
    }

    // XSS対策（エスケープ処理）
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 初回読み込み
    fetchPosts();
  </script>
</body>
</html>
